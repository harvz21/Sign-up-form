<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Sign Up Form</title>
    <link rel="stylesheet" href="signup-fancy.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>Sign Up</h2>
            <form action="#">
                <div class="input-box">
                    <input type="text" required>
                    <span>Username</span>
                </div>
                <div class="input-box">
                    <input type="email" required>
                    <span>Email</span>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <span>Password</span>
                </div>
                <div class="input-box">
                    <input type="password" required>
                    <span>Confirm Password</span>
                </div>
                <button type="submit" class="glow-button">Sign Up</button>
                <div class="login-link">
                    <p>Already have an account? <a href="login.html">Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
